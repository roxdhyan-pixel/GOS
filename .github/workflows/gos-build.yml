# File name: section3-kernel-build.yml
# Path in repo: .github/workflows/section3-kernel-build.yml
name: GOS Build - Section 3 - Kernel Build

on:
  workflow_dispatch:

env:
  DEVICE: dandelion
  DEFCONFIG: dandelion_defconfig
  ARCH: arm64
  KERNEL_URL: https://github.com/dandelion64-Archives/android_kernel_xiaomi_dandelion.git
  KERNEL_BRANCH: android-10.0

jobs:
  kernel-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout GOS repo
        uses: actions/checkout@v4

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex \
            libssl-dev libncurses-dev python2 python3 \
            device-tree-compiler cpio rsync

      - name: Restore Proton Clang toolchain from Section 1's cache
        uses: actions/cache/restore@v4
        with:
          path: toolchains/proton-clang
          key: gos-${{ env.DEVICE }}-toolchain-nomatch
          restore-keys: |
            gos-${{ env.DEVICE }}-toolchain-

      - name: Clone Proton Clang if cache miss
        run: |
          if [ ! -f "toolchains/proton-clang/bin/clang" ]; then
            echo "Cache miss - cloning Proton Clang fresh"
            mkdir -p toolchains
            git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchains/proton-clang
          else
            echo "Restored Proton Clang from cache"
          fi
          echo "$(pwd)/toolchains/proton-clang/bin" >> $GITHUB_PATH

      - name: Verify clang is actually usable
        run: |
          export PATH="$(pwd)/toolchains/proton-clang/bin:$PATH"
          if ! command -v clang &> /dev/null; then
            echo "::error::clang not found on PATH after toolchain setup"
            exit 1
          fi
          clang --version

      - name: Clone kernel source
        run: |
          mkdir -p source/kernel/xiaomi
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_URL" source/kernel/xiaomi/mt6762

      - name: Verify kernel source is present
        run: |
          if [ ! -d "source/kernel/xiaomi/mt6762" ] || [ -z "$(ls -A source/kernel/xiaomi/mt6762 2>/dev/null)" ]; then
            echo "::error::Kernel source not found - check KERNEL_URL in this workflow is set to a real repo"
            exit 1
          fi
          echo "Kernel source found:"
          ls -la source/kernel/xiaomi/mt6762

      - name: Auto-detect the real defconfig filename
        run: |
          cd source/kernel/xiaomi/mt6762
          CONFIG_DIR="arch/$ARCH/configs"
          if [ -f "$CONFIG_DIR/$DEFCONFIG" ]; then
            echo "Guessed DEFCONFIG ($DEFCONFIG) exists, using it"
            echo "REAL_DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV
          else
            echo "Guessed DEFCONFIG ($DEFCONFIG) not found, searching for a match..."
            MATCH=$(ls "$CONFIG_DIR" 2>/dev/null | grep -i "dandelion\|mt6765\|mt6762" | head -n1)
            if [ -n "$MATCH" ]; then
              echo "Found likely match: $MATCH"
              echo "REAL_DEFCONFIG=$MATCH" >> $GITHUB_ENV
            else
              echo "::error::No matching defconfig found. Available configs in $CONFIG_DIR:"
              ls "$CONFIG_DIR" 2>/dev/null || echo "$CONFIG_DIR does not exist"
              exit 1
            fi
          fi

      - name: Patch defconfig - bypass stack protector for modern toolchain
        run: |
          cd source/kernel/xiaomi/mt6762
          DEFCONFIG_PATH="arch/$ARCH/configs/$REAL_DEFCONFIG"
          sed -i '/CONFIG_CC_STACKPROTECTOR/d' "$DEFCONFIG_PATH"
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> "$DEFCONFIG_PATH"
          echo "Patched $DEFCONFIG_PATH"

      - name: Configure kernel (defconfig)
        run: |
          cd source/kernel/xiaomi/mt6762
          make O=out ARCH=$ARCH CC=clang $REAL_DEFCONFIG
          if [ ! -f "out/.config" ]; then
            echo "::error::Kernel configure step did not produce out/.config - defconfig may be incompatible"
            exit 1
          fi

      - name: Disable -Werror (modern clang produces new warnings old kernels don't expect)
        run: |
          cd source/kernel/xiaomi/mt6762
          find . -name "Makefile" -exec sed -i 's/-Werror//g' {} \;
          sed -i 's/-Werror//g' Makefile 2>/dev/null || true
          echo "Stripped -Werror from Makefiles so new clang warnings don't halt the build"

      - name: Build kernel with Proton Clang
        run: |
          cd source/kernel/xiaomi/mt6762
          make -j$(nproc) O=out ARCH=$ARCH \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM_IAS=0 \
            KCFLAGS="-Wno-error" \
            2>&1 | tee kernel_build.log

      - name: Verify kernel image was produced
        run: |
          cd source/kernel/xiaomi/mt6762
          if [ -f "out/arch/$ARCH/boot/Image.gz-dtb" ]; then
            echo "Kernel build succeeded"
            ls -la out/arch/$ARCH/boot/
          elif [ -f "out/arch/$ARCH/boot/Image" ]; then
            echo "Kernel build succeeded (plain Image, no dtb appended)"
            ls -la out/arch/$ARCH/boot/
          else
            {
              echo "## Kernel build FAILED - no Image produced"
              echo ""
              echo "Last 150 lines of kernel_build.log:"
              echo '```'
              tail -150 kernel_build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No kernel Image found - see the Summary tab on this workflow run for the failure log"
            exit 1
          fi

      - name: Upload full kernel build log (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section3-kernel-build-log
          path: source/kernel/xiaomi/mt6762/kernel_build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload compiled kernel for Section 4
        uses: actions/upload-artifact@v4
        with:
          name: section3-kernel-ready
          path: |
            source/kernel/xiaomi/mt6762/out/arch/*/boot/Image*
            source/kernel/xiaomi/mt6762/kernel_build.log
          retention-days: 3
