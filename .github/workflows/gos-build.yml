# File name: section1-environment-setup.yml
# Path in repo: .github/workflows/section1-environment-setup.yml
name: GOS Build - Section 1 - Environment Setup

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  DEVICE: dandelion
  BUILD_TYPE: userdebug
  ANDROID_TARGET: "16"

jobs:
  environment-setup:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout GOS repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install base build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig python2 python3 python3-pip ccache \
            openjdk-17-jdk bc rsync schedtool libssl-dev \
            imagemagick lib32ncurses5-dev libx11-dev lib32z-dev \
            liblz4-tool libsdl1.2-dev libwxgtk3.0-gtk3-dev \
            squashfs-tools pngcrush schedtool dpkg-dev

      - name: Set up python2 for legacy device scripts (DrvGen.py etc.)
        run: |
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          python2 --version

      - name: Set up repo tool
        run: |
          mkdir -p ~/bin
          curl -o ~/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git identity
        run: |
          git config --global user.name "GOS Build Bot"
          git config --global user.email "build@grape-gos.dev"
          git config --global color.ui false

      - name: Clone Proton Clang toolchain
        run: |
          mkdir -p toolchains
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchains/proton-clang
          echo "PATH=$(pwd)/toolchains/proton-clang/bin:$PATH" >> $GITHUB_ENV

      - name: Set up ccache
        run: |
          mkdir -p ~/.ccache
          ccache -M 20G
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_EXEC=$(which ccache)" >> $GITHUB_ENV

      - name: Cache toolchain and ccache between runs
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            toolchains/proton-clang
          key: gos-${{ env.DEVICE }}-toolchain-${{ hashFiles('**/*.yml') }}
          restore-keys: |
            gos-${{ env.DEVICE }}-toolchain-

      - name: Generate GOS launcher icons from logo
        run: |
          mkdir -p out/mipmap-mdpi out/mipmap-hdpi out/mipmap-xhdpi \
                   out/mipmap-xxhdpi out/mipmap-xxxhdpi
          if [ -f "branding/gos-logo.png" ]; then
            LOGO="branding/gos-logo.png"
          elif [ -f "branding/gos-logo.jpg" ]; then
            LOGO="branding/gos-logo.jpg"
          else
            echo "No logo found at branding/gos-logo.png(.jpg) - skipping icon generation for now"
            LOGO=""
          fi
          if [ -n "$LOGO" ]; then
            convert "$LOGO" -resize 48x48   out/mipmap-mdpi/ic_launcher.png
            convert "$LOGO" -resize 72x72   out/mipmap-hdpi/ic_launcher.png
            convert "$LOGO" -resize 96x96   out/mipmap-xhdpi/ic_launcher.png
            convert "$LOGO" -resize 144x144 out/mipmap-xxhdpi/ic_launcher.png
            convert "$LOGO" -resize 192x192 out/mipmap-xxxhdpi/ic_launcher.png
            convert "$LOGO" -resize 512x512 out/gos-logo-large.png
            convert "$LOGO" -resize 1080x1080 out/gos-logo-splash.png
          fi

      - name: Verify environment
        run: |
          echo "== GOS Section 1 environment ready =="
          echo "Device: $DEVICE"
          echo "Android target: $ANDROID_TARGET"
          clang --version || echo "clang not yet on PATH in this step (expected until Section 2)"
          python2 --version
          java -version

      - name: Upload environment marker for Section 2
        uses: actions/upload-artifact@v4
        with:
          name: section1-env-ready
          path: |
            toolchains/proton-clang/bin/clang
          retention-days: 1

      - name: Upload generated icons and logo assets
        uses: actions/upload-artifact@v4
        with:
          name: section1-gos-icons
          path: out/
          retention-days: 7
          if-no-files-found: ignore
