# File name: launcher-build.yml
# Path in repo: .github/workflows/launcher-build.yml
name: GOS Launcher - Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'launcher/**'

jobs:
  build-launcher:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout GOS repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x launcher/gradlew

      - name: Build debug APK
        run: |
          cd launcher
          ./gradlew assembleDebug

      - name: Verify APK was produced
        run: |
          cd launcher
          APK=$(find . -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found after build - check the Gradle log above"
            exit 1
          fi
          echo "Built: $APK"

      - name: Upload launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: gos-launcher-debug-apk
          path: launcher/**/build/outputs/apk/**/*.apk
          retention-days: 7
