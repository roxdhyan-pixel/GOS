# File name: section2-source-sync.yml
# Path in repo: .github/workflows/section2-source-sync.yml
name: GOS Build - Section 2 - Source Sync

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["GOS Build - Section 1 - Environment Setup"]
    types:
      - completed

env:
  DEVICE: dandelion
  ANDROID_TARGET: "16"
  MANIFEST_URL: https://github.com/LineageOS/android.git
  MANIFEST_BRANCH: lineage-23.0
  DEVICE_TREE_URL: https://github.com/YOUR_ORG/android_device_xiaomi_dandelion.git
  DEVICE_TREE_BRANCH: lineage-23.0
  KERNEL_URL: https://github.com/YOUR_ORG/android_kernel_xiaomi_mt6762.git
  KERNEL_BRANCH: lineage-23.0
  # Persistent path on YOUR disk - stays between runs, this is what makes it fast
  SOURCE_DIR: /home/runner-persistent/gos-source

jobs:
  source-sync:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: self-hosted
    timeout-minutes: 300

    steps:
      - name: Checkout GOS repo
        uses: actions/checkout@v4

      - name: Ensure repo tool is installed (one-time)
        run: |
          if ! command -v repo &> /dev/null; then
            mkdir -p ~/bin
            curl -o ~/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
            chmod a+x ~/bin/repo
            echo "$HOME/bin" >> $GITHUB_PATH
          else
            echo "repo tool already installed, skipping"
          fi

      - name: Configure git identity (one-time, harmless if repeated)
        run: |
          git config --global user.name "GOS Build Bot"
          git config --global user.email "build@grape-gos.dev"
          git config --global color.ui false

      - name: Init manifest only if source tree doesn't exist yet
        run: |
          mkdir -p "$SOURCE_DIR"
          cd "$SOURCE_DIR"
          if [ ! -d ".repo" ]; then
            echo "First run - initializing manifest (this part is one-time)"
            repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth=1
          else
            echo "Existing source tree found at $SOURCE_DIR - skipping init"
          fi

      - name: Sync sources (fast incremental after first run)
        run: |
          cd "$SOURCE_DIR"
          for attempt in 1 2 3; do
            echo "Sync attempt $attempt..."
            repo sync -c -j4 --no-clone-bundle --no-tags && break
            echo "Sync attempt $attempt failed, retrying in 15s..."
            sleep 15
          done

      - name: Clone or update dandelion device tree
        run: |
          DT_PATH="$SOURCE_DIR/device/xiaomi/dandelion"
          if [[ "$DEVICE_TREE_URL" == *"YOUR_ORG"* ]]; then
            echo "::warning::DEVICE_TREE_URL is still a placeholder - skipping."
          elif [ -d "$DT_PATH/.git" ]; then
            echo "Device tree exists - pulling latest instead of full clone"
            git -C "$DT_PATH" pull
          else
            mkdir -p "$SOURCE_DIR/device/xiaomi"
            git clone --depth=1 -b "$DEVICE_TREE_BRANCH" "$DEVICE_TREE_URL" "$DT_PATH"
          fi

      - name: Clone or update dandelion kernel source
        run: |
          KERNEL_PATH="$SOURCE_DIR/kernel/xiaomi/mt6762"
          if [[ "$KERNEL_URL" == *"YOUR_ORG"* ]]; then
            echo "::warning::KERNEL_URL is still a placeholder - skipping."
          elif [ -d "$KERNEL_PATH/.git" ]; then
            echo "Kernel source exists - pulling latest instead of full clone"
            git -C "$KERNEL_PATH" pull
          else
            mkdir -p "$SOURCE_DIR/kernel/xiaomi"
            git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_URL" "$KERNEL_PATH"
          fi

      - name: Apply Python 2 legacy patch for DrvGen.py
        run: |
          sudo ln -sf /usr/bin/python2 /usr/bin/python 2>/dev/null || true
          DRVGEN="$SOURCE_DIR/device/xiaomi/dandelion/DrvGen.py"
          if [ -f "$DRVGEN" ]; then
            echo "Found DrvGen.py, verifying it runs under python2..."
            python2 "$DRVGEN" --check || echo "Adjust this check to the device tree's actual usage"
          else
            echo "DrvGen.py not found yet - add device tree first"
          fi

      - name: Verify source tree structure
        run: |
          echo "== GOS Section 2 source sync complete =="
          echo "Source tree location: $SOURCE_DIR (persistent across runs)"
          ls -la "$SOURCE_DIR/device/xiaomi/dandelion" 2>/dev/null || echo "device tree missing"
          ls -la "$SOURCE_DIR/kernel/xiaomi/mt6762" 2>/dev/null || echo "kernel source missing"
