# File name: section2-source-sync.yml
# Path in repo: .github/workflows/section2-source-sync.yml
name: GOS Build - Section 2 - Source Sync

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["GOS Build - Section 1 - Environment Setup"]
    types:
      - completed

env:
  DEVICE: dandelion
  ANDROID_TARGET: "16"
  MANIFEST_URL: https://github.com/LineageOS/android.git
  MANIFEST_BRANCH: lineage-23.0
  DEVICE_TREE_URL: https://github.com/YOUR_ORG/android_device_xiaomi_dandelion.git
  DEVICE_TREE_BRANCH: lineage-23.0
  KERNEL_URL: https://github.com/YOUR_ORG/android_kernel_xiaomi_mt6762.git
  KERNEL_BRANCH: lineage-23.0

jobs:
  source-sync:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Checkout GOS repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune -af 2>/dev/null || true
          df -h

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -o ~/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git identity
        run: |
          git config --global user.name "GOS Build Bot"
          git config --global user.email "build@grape-gos.dev"
          git config --global color.ui false

      - name: Init repo manifest (Android 16 / lineage-23.0)
        run: |
          mkdir -p source
          cd source
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth=1

      - name: Trim manifest - skip groups not needed for a single device build
        run: |
          mkdir -p source/.repo/local_manifests
          cat > source/.repo/local_manifests/remove_unused.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remove-project name="platform/cts" />
            <remove-project name="platform/development/samples" />
            <remove-project name="platform/docs/source.android.com" />
            <remove-project name="platform/pdk" />
          </manifest>
          EOF

      - name: Sync sources (trimmed, safe retries)
        run: |
          cd source
          for attempt in 1 2 3; do
            echo "Sync attempt $attempt..."
            repo sync -c -j4 --no-clone-bundle --no-tags \
              --groups=default,-cts,-pdk,-samples,-darwin,-notdefault && break
            echo "Sync attempt $attempt failed, retrying in 15s..."
            sleep 15
          done

      - name: Clone dandelion device tree
        run: |
          mkdir -p source/device/xiaomi
          if [[ "$DEVICE_TREE_URL" == *"YOUR_ORG"* ]]; then
            echo "::warning::DEVICE_TREE_URL is still a placeholder - skipping."
          else
            git clone --depth=1 -b "$DEVICE_TREE_BRANCH" "$DEVICE_TREE_URL" \
              source/device/xiaomi/dandelion
          fi

      - name: Clone dandelion kernel source
        run: |
          mkdir -p source/kernel/xiaomi
          if [[ "$KERNEL_URL" == *"YOUR_ORG"* ]]; then
            echo "::warning::KERNEL_URL is still a placeholder - skipping."
          else
            git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_URL" \
              source/kernel/xiaomi/mt6762
          fi

      - name: Apply Python 2 legacy patch for DrvGen.py
        run: |
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          DRVGEN="source/device/xiaomi/dandelion/DrvGen.py"
          if [ -f "$DRVGEN" ]; then
            echo "Found DrvGen.py, verifying it runs under python2..."
            python2 "$DRVGEN" --check || echo "Adjust this check to the device tree's actual usage"
          else
            echo "DrvGen.py not found yet - add device tree first"
          fi

      - name: Verify source tree structure
        run: |
          echo "== GOS Section 2 source sync complete =="
          ls -la source/device/xiaomi/dandelion || echo "device tree missing"
          ls -la source/kernel/xiaomi/mt6762 || echo "kernel source missing"

      - name: Upload synced source tree for Section 3
        uses: actions/upload-artifact@v4
        with:
          name: section2-source-ready
          path: |
            source/device/xiaomi/dandelion
            source/kernel/xiaomi/mt6762
          retention-days: 1
